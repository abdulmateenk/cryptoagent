# Wakes the agent every 5 minutes so it scans the market and tracks trades,
# even when nobody has the portal open. Needed on Vercel (serverless).
#
# Setup (README, Option V):
#   - repo SECRET  VERCEL_BYPASS_SECRET = Vercel → Settings → Deployment Protection →
#                                         "Protection Bypass for Automation" secret
#   - repo VARIABLE AGENT_URL (optional) = your portal address if it isn't the default below
name: Agent timer

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: agent-timer
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the agent
        env:
          AGENT_URL: ${{ vars.AGENT_URL }}
          BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: |
          URL="${AGENT_URL:-https://cryptoagent-laurent-corporates.vercel.app}"
          URL="${URL%/}"
          H=()
          if [ -n "$BYPASS" ]; then H=(-H "x-vercel-protection-bypass: $BYPASS"); fi

          if curl -fsS -m 15 "${H[@]}" "$URL/health" | grep -q '"ok":true'; then
            echo "Agent found at $URL"
            curl -fsS -m 110 "${H[@]}" -X POST "$URL/api/tick" || echo "::warning::Tick did not finish (will retry next run)"
            echo
            exit 0
          fi

          echo "::error::Agent not reachable at $URL"
          if [ -z "$BYPASS" ]; then
            echo "::error::Missing repo secret VERCEL_BYPASS_SECRET. Vercel Deployment Protection blocks the timer without it (see README)."
          fi
          echo "--- what the server answered ---"
          curl -sS -m 15 "${H[@]}" -o /tmp/body -D /tmp/head "$URL/health" -w "status=%{http_code}\n" || true
          grep -iE "^(x-vercel-error|location|content-type):" /tmp/head || true
          head -c 300 /tmp/body; echo
          exit 1
